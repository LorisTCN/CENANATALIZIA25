<style>
  :root {
    --primary:#0b5fff; --primary-700:#0a48cc; --ink:#0b1222; --bg:#ffffff;

  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width: 900px; margin:auto; padding:16px; }
  header { display:flex; align-items:center; justify-content:center; padding:8px 0 12px; }
  .logo { display:inline-block; max-width: 260px; width: 60%; }
  .status { text-align:center; margin:8px 0 0; font-size:14px; color:var(--muted); }
  .card { background: var(--card); border-radius:16px; padding:12px; margin-bottom:16px; border:1px solid var(--border); }
  .canvas-wrap { display:flex; justify-content:center; }
  canvas { width:100%; max-width:260px; height:auto; }
  .board { text-align:center; }
  .word { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
  .slot { width:28px; height:38px; border-bottom:2px solid var(--primary-700); font-size:22px; display:flex; justify-content:center; align-items:center; }
  .space { border-bottom:none; width:16px; }
  .kbd { display:grid; grid-template-columns: repeat(auto-fit, minmax(34px, 1fr)); gap:8px; margin-top:14px; }
  .kbd button { padding:12px 0; border-radius:10px; border:1px solid var(--border); background:#ffffff; color:var(--ink); font-size:16px; touch-action: manipulation; }
  .kbd button:disabled { opacity:.55; }
  .kbd button.hit { background:#e8f0ff; border-color:#c5d4ff; }
  .kbd button.miss { background:#ffe8e8; border-color:#ffd0d0; }
  .bar { margin-top:14px; text-align:center; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .btn { padding:12px 18px; border-radius:10px; border:1px solid var(--border); background:#ffffff; color:var(--ink); font-size:16px; }
  .btn.primary { background: var(--primary); color:white; border-color: var(--primary-700); }
  .blink { color:var(--danger); font-weight:900; animation: blink .4s step-start 12; }
  @keyframes blink { 0%,50%{opacity:1;} 51%,100%{opacity:0;} }
  .msg { min-height:28px; margin-top:10px; font-size:18px; text-align:center; }
  .shake { animation: shake .4s ease; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  .overlay { position: fixed; inset: 0; display:none; place-items:center; background: rgba(0,0,0,.35); backdrop-filter: blur(2px); z-index: 50; }
  .overlay.show { display: grid; }
  .modal { background: #ffffff; border:1px solid var(--border); border-radius:18px; padding:20px; max-width: 420px; width: calc(100% - 32px); text-align:center; box-shadow: 0 20px 60px rgba(2, 6, 23, .15); }
  .modal h2 { margin: 0 0 8px; font-size: clamp(20px, 4.5vw, 26px); color: var(--primary-700); }
  .modal p { margin: 6px 0 16px; }
  .cta { display:inline-block; text-decoration:none; background:var(--primary); color:white; padding:12px 16px; border-radius:10px; font-weight:700; }

  </header>
  <div class="status" id="attempts">Tentativi: 0/5</div>

  <div class="card">
    <div class="canvas-wrap" id="canvasWrap"><canvas id="hang" width="300" height="260"></canvas></div>
  </div>

  <div class="card">
    <div class="board">
      <div id="word" class="word"></div>
      <div id="message" class="msg"></div>
    </div>
    <div id="keyboard" class="kbd"></div>
    <div class="bar">
      <button class="btn" id="hintBtn">💡 Indizio</button>
      <button class="btn primary" id="resetBtn">🔁 Ricomincia</button>
    </div>
  </div>
</div>

<div class="overlay" id="winOverlay" aria-hidden="true">
  <div class="modal">
    <h2>🎷 Bravo! Ci vediamo là</h2>
    <p>Hai indovinato la destinazione. Preparati per la serata! 😉</p>
    <a class="cta" href="https://maps.google.com/?q=JAZZ%20CAFE%20Milano" target="_blank" rel="noopener">Apri in Google Maps</a>
  </div>
</div>

<script>
(function(){
  // Secret phrase hidden via Base64 to avoid showing in link previews or quick scans.
  const ENCODED_SECRET = "SkFaWiBDQUZF"; // "JAZZ CAFE" in Base64
  const SECRET_PHRASE = (typeof atob === 'function') ? atob(ENCODED_SECRET) : "JAZZ CAFE"; // graceful fallback

  const MAX_MISSES = 5;
  const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

  let guessed = new Set();
  let misses = 0;

  const wordEl = document.getElementById("word");
  const keyboardEl = document.getElementById("keyboard");
  const msgEl = document.getElementById("message");
  const attemptsEl = document.getElementById("attempts");
  const hintBtn = document.getElementById("hintBtn");
  const resetBtn = document.getElementById("resetBtn");
  const canvas = document.getElementById("hang");
  const ctx = canvas.getContext("2d");
  const canvasWrap = document.getElementById("canvasWrap");
  const winOverlay = document.getElementById("winOverlay");

  function playWinJingle(){
    try{
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const actx = new AudioCtx();
      const now = actx.currentTime;
      const master = actx.createGain();
      master.gain.value = 0.12; master.connect(actx.destination);
      function tone(freq, start, dur, type="sine", vol=1){
        const o = actx.createOscillator(); const g = actx.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(0, now+start);
        g.gain.linearRampToValueAtTime(0.001+vol*0.5, now+start+0.02);
        g.gain.exponentialRampToValueAtTime(0.0008, now+start+dur);
        o.connect(g); g.connect(master); o.start(now+start); o.stop(now+start+dur+0.05);
      }
      [["chord",[261.63,329.63,392.00,466.16],0,0.25],
       ["hit",[440],0.28,0.15],
       ["hit",[587.33],0.46,0.18]].forEach(([_, arr, st, du])=>{
        arr.forEach((f,i)=>tone(f, st + i*0.005, du, i%2 ? "triangle" : "sine", 1));
      });
    }catch(e){ }
  }

  function isLetter(c){ return /^[A-Z]$/.test(c); }
  function isSpace(c){ return c===" "; }

  function allRevealed(){
    for(let i=0;i<SECRET_PHRASE.length;i++){
      const c = SECRET_PHRASE[i];
      if(!isSpace(c) && !guessed.has(c)) return false;
    }
    return true;
  }

  function renderWord(){
    wordEl.innerHTML="";
    for(let ch of SECRET_PHRASE){
      let div=document.createElement("div");
      div.className="slot"+(isSpace(ch)?" space":"");
      div.textContent = guessed.has(ch)? ch : "";
      wordEl.appendChild(div);
    }
  }

  function renderKeyboard(){
    keyboardEl.innerHTML="";
    LETTERS.forEach(letter=>{
      let btn=document.createElement("button");
      btn.textContent=letter;
      btn.disabled = guessed.has(letter);
      if(guessed.has(letter) && !SECRET_PHRASE.includes(letter)) btn.classList.add("miss");
      if(guessed.has(letter) && SECRET_PHRASE.includes(letter)) btn.classList.add("hit");
      btn.onclick=()=>handleGuess(letter);
      keyboardEl.appendChild(btn);
    });
  }

  function drawBase(){
    ctx.clearRect(0,0,300,260);
    ctx.lineWidth=4; ctx.strokeStyle= getComputedStyle(document.documentElement).getPropertyValue('--primary-700').trim() || "#0a48cc";
    line(20,230,130,230);
    line(40,230,40,30);
    line(40,30,190,30);
    line(190,30,190,55);
  }
  function line(x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
  function circle(cx,cy,r){ ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke(); }

  function drawState(m){
    drawBase();
    ctx.strokeStyle="#1f2d5c";
    if(m>=1) circle(190,75,20);
    if(m>=2) line(190,95,190,140);
    if(m>=3) line(190,110,160,130);
    if(m>=4) line(190,110,220,130);
    if(m>=5){ line(190,140,160,170); line(190,140,220,170); }
  }

  function handleGuess(letter){
    if(guessed.has(letter)) return;
    guessed.add(letter);

    if(SECRET_PHRASE.includes(letter)){
      renderWord();
      renderKeyboard();
      if(allRevealed()){
        msgEl.textContent="🎉 Hai vinto!";
        disable();
        playWinJingle();
        winOverlay.classList.add("show");
        winOverlay.setAttribute("aria-hidden","false");
      }
    } else {
      misses++;
      attemptsEl.textContent=`Tentativi: ${misses}/${MAX_MISSES}`;
      drawState(misses);
      renderKeyboard();
      document.getElementById("canvasWrap").classList.remove("shake"); void document.getElementById("canvasWrap").offsetWidth; document.getElementById("canvasWrap").classList.add("shake");
      if(misses>=MAX_MISSES){
        msgEl.textContent="Hai perso! Ritenta.";
        disable();
      }
    }
  }

  function disable(){
    document.querySelectorAll(".kbd button").forEach(b=>b.disabled=true);
    window.removeEventListener("keydown", onKey);
  }

  function onKey(e){
    const c = e.key.toUpperCase();
    if(isLetter(c)) handleGuess(c);
  }

  function hint(){
    msgEl.textContent="SCORDATELO";
    msgEl.className="msg blink";
    setTimeout(reset, 1200);
  }

  function reset(){
    guessed=new Set(); misses=0;
    attemptsEl.textContent=`Tentativi: 0/${MAX_MISSES}`;
    msgEl.textContent=""; msgEl.className="msg";
    drawBase();
    renderWord();
    renderKeyboard();
    window.addEventListener("keydown",onKey);
    document.getElementById("canvasWrap").classList.remove("shake");
    winOverlay.classList.remove("show");
    winOverlay.setAttribute("aria-hidden","true");
  }

  hintBtn.onclick=hint;
  resetBtn.onclick=reset;
  winOverlay.addEventListener("click", (e)=>{ if(e.target === winOverlay){ winOverlay.classList.remove("show"); winOverlay.setAttribute("aria-hidden","true"); } });

  reset();
})();
</script>
